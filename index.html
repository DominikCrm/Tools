const titles={kosten:"KostenKompass",zeit:"Arbeitszeiten & Gehaltsrechner"};
const home=document.getElementById('home'),shell=document.getElementById('appShell'),frame=document.getElementById('appFrame');
const globalTheme=document.getElementById('globalTheme');
function setGlobalTheme(mode){const dark=mode==='dark'||(mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';shell.dataset.theme=dark?'dark':'light';globalTheme.value=mode;}
setGlobalTheme(localStorage.getItem('combined-theme-mode')||'system');
globalTheme.addEventListener('change',()=>{localStorage.setItem('combined-theme-mode',globalTheme.value);localStorage.setItem('kostenkompass-theme',globalTheme.value);setGlobalTheme(globalTheme.value);});
window.addEventListener('storage',e=>{if(e.key==='combined-theme-mode')setGlobalTheme(e.newValue||'system');});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if((localStorage.getItem('combined-theme-mode')||'system')==='system')setGlobalTheme('system');});
function openApp(key){document.getElementById('appName').textContent=titles[key];setGlobalTheme(localStorage.getItem('combined-theme-mode')||'system');frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(pages[key]),c=>c.charCodeAt(0)));home.hidden=true;shell.classList.add('active');document.title=titles[key];}
function goHome(){shell.classList.remove('active');home.hidden=false;document.title='Meine Apps';}
document.querySelectorAll('[data-app]').forEach(button=>button.addEventListener('click',()=>openApp(button.dataset.app)));
document.getElementById('homeButton').addEventListener('click',goHome);
</script></body></html>
